# deploy/web/apache-security.conf
# Hide the Apache version in headers and error pages.
ServerTokens Prod
ServerSignature Off

# src/ and config/ are only meant to be required by PHP, never opened in a browser.
# (Locally XAMPP serves them; here we lock the door: 403 Forbidden.)
<DirectoryMatch "^/var/www/html/(src|config)">
    Require all denied
</DirectoryMatch>
