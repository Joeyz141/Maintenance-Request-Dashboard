; deploy/web/php-production.ini
; Loaded after php.ini, so these lines win.

; Never show PHP errors (file paths, SQL) to visitors. They go to the container log instead
; (docker compose logs web), like C:\xampp\apache\logs\error.log locally.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Don't advertise the PHP version in the "X-Powered-By" header.
expose_php = Off

; Secure cookie flag: the browser only sends the session cookie over HTTPS.
; ${...} is filled from the container's environment (compose.yaml): 1 with HTTPS, 0 for plain HTTP.
; csrf.php's session_set_cookie_params() keeps this setting (it only sets httponly + samesite).
session.cookie_secure = ${SESSION_COOKIE_SECURE}

; Time zone for PHP's date functions (the database's own time zone is set with TZ in compose.yaml).
date.timezone = America/Los_Angeles
